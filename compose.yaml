services:
  rhizome:
    build: .
    container_name: rhizome
    restart: unless-stopped
    ports:
      - "47831:47831/tcp"
      - "47830:47830/udp"
    volumes:
      - rhizome-data:/data
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:47832/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rhizome-data:
