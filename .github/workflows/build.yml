name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check internal/app/web/canopy.js
      - run: go build -trimpath -ldflags "-s -w" -o dist/canopy-linux-amd64 ./cmd/canopy
      - name: Smoke test embedded interface
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/canopy-smoke"
          ./dist/canopy-linux-amd64 --no-browser --data-dir "$data" >"$RUNNER_TEMP/canopy.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:47832/api/status >"$RUNNER_TEMP/status.json"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1
          curl -fsS http://127.0.0.1:47832/ | grep -q "Canopy 5"
          grep -q '"product":"Canopy"' "$RUNNER_TEMP/status.json"
          grep -q '"release":"5.0.0"' "$RUNNER_TEMP/status.json"
          grep -q '"protocol":"LICHEN/2"' "$RUNNER_TEMP/status.json"
      - run: docker build -t canopy-ci .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - name: Build Windows GUI and diagnostic binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/canopy.exe ./cmd/canopy
          go build -trimpath -ldflags "-s -w" -o dist/canopy-console.exe ./cmd/canopy
          Copy-Item LICENSE, NOTICE -Destination dist
          @'
          @echo off
          curl.exe -fsS http://127.0.0.1:47832/api/status >nul 2>&1
          if errorlevel 1 (
            start "Canopy" "%~dp0canopy.exe"
            timeout /t 2 /nobreak >nul
          )
          start "Canopy Interface" "http://127.0.0.1:47832/"
          '@ | Set-Content -Encoding ASCII dist/open-canopy.cmd
          @'
          CANOPY 5 FOR WINDOWS

          1. Run canopy.exe.
          2. The browser interface opens automatically.
          3. If it does not open, run open-canopy.cmd.
          4. If Canopy reports an error, run canopy-console.exe and send canopy.log.

          Interface: http://127.0.0.1:47832/
          Data: %APPDATA%\Canopy (or the migrated Reef/Rhizome/Lichen directory)

          Canopy 5 keeps the LICHEN/2 wire protocol for compatibility. The
          displayed overlay IP is still a stable identity address; a Windows
          TUN/Wintun interface is not claimed until it is actually implemented.
          '@ | Set-Content -Encoding UTF8 dist/README-WINDOWS.txt
      - name: Smoke test Windows console build and interface
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "canopy-smoke"
          $process = Start-Process -FilePath ".\dist\canopy-console.exe" -ArgumentList "--no-browser", "--data-dir", $data -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              try {
                $status = Invoke-RestMethod -Uri "http://127.0.0.1:47832/api/status" -TimeoutSec 1
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if (-not $ready) { throw "Canopy interface did not start" }
            if ($status.product -ne "Canopy") { throw "Unexpected product: $($status.product)" }
            if ($status.release -ne "5.0.0") { throw "Unexpected release: $($status.release)" }
            if ($status.protocol -ne "LICHEN/2") { throw "Unexpected protocol: $($status.protocol)" }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:47832/" -UseBasicParsing
            if ($page.Content -notmatch "Canopy 5") { throw "Embedded GUI is missing" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: canopy-windows-amd64
          path: dist/*

  release-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/canopy-v5'
    needs: [test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: canopy-windows-amd64
          path: package/windows
      - name: Build and package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o package/linux/canopy ./cmd/canopy
          cp LICENSE NOTICE package/linux/
          cp README.md package/linux/README.txt
          (cd package/windows && zip -r ../../canopy-windows-amd64.zip .)
          tar -C package/linux -czf canopy-linux-amd64.tar.gz .
          sha256sum canopy-windows-amd64.zip canopy-linux-amd64.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: canopy-v5.0.0-preview
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: Canopy 5.0.0 Preview
          prerelease: true
          make_latest: false
          body_path: docs/releases/canopy-5.0.0.md
          files: |
            canopy-windows-amd64.zip
            canopy-linux-amd64.tar.gz
            SHA256SUMS.txt
