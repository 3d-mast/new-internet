name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o dist/boreal-linux-amd64 ./cmd/canopy
      - run: docker build -t boreal-ci .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - name: Build Windows GUI and console
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/boreal.exe ./cmd/canopy
          go build -trimpath -ldflags "-s -w" -o dist/boreal-console.exe ./cmd/canopy
      - uses: actions/upload-artifact@v4
        with:
          name: boreal-windows-amd64
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: boreal-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - working-directory: esp32
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: boreal-esp32
          path: |
            esp32/build/*.bin
            esp32/build/bootloader/*.bin
            esp32/build/partition_table/*.bin
